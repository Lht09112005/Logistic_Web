<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256) scale(0.85)" fill="white">
    <!-- Truck body -->
    <rect x="-180" y="-80" width="280" height="140" rx="12" fill="white"/>
    <rect x="-240" y="-50" width="80" height="110" rx="8" fill="white" opacity="0.95"/>
    <!-- Cab window -->
    <rect x="-220" y="-30" width="50" height="55" rx="6" fill="#f97316"/>
    <!-- Wheels -->
    <circle cx="-120" cy="75" r="35" fill="white"/>
    <circle cx="-120" cy="75" r="20" fill="#f97316"/>
    <circle cx="60" cy="75" r="35" fill="white"/>
    <circle cx="60" cy="75" r="20" fill="#f97316"/>
    <!-- Cargo lines -->
    <line x1="-140" y1="-30" x2="-140" y2="40" stroke="#f97316" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
    <line x1="-100" y1="-30" x2="-100" y2="40" stroke="#f97316" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
    <line x1="-60" y1="-30" x2="-60" y2="40" stroke="#f97316" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>
